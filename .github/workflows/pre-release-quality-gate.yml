name: Pre-Release Quality Gate

# Gates release-bearing changes: when a PR bumps `.claude-plugin/plugin.json`
# or `.codex-plugin/plugin.json` (i.e., is a release prep PR), this workflow
# must pass before merge. Two assertions:
#
#   1. SCORE GATE — the NL artifacts CHANGED IN THIS PR score at least
#      MIN_SCORE (95) against nlpm's own rubric. Combination of
#      bin/nlpm-check (deterministic floor — manifest parsing,
#      manifest-vs-disk diff, frontmatter required fields, hook event-name
#      case; runs on the whole repo) and the LLM-judged scorer (via
#      claude-code-action) against the full Tier 2-Claude rubric (vague
#      quantifiers, instruction quality, output format, scope notes, etc.).
#
#      The LLM scorer runs on ONLY the NL artifacts the PR changed, not the
#      whole corpus. Because that scorer is non-deterministic (see below),
#      scoring unchanged pre-existing artifacts blocked releases on pure
#      noise — a version-bump-only PR was judged on 40+ files it never
#      touched, and different borderline files dipped under 95 each run.
#      Deterministic checks (bin/nlpm-check, the vocab gate) stay whole-repo;
#      only the noisy LLM score is scoped to the diff. A manual
#      workflow_dispatch scores everything (a deliberate full sweep).
#
#      Why >= 95 and not == 100: the LLM scorer is non-deterministic —
#      back-to-back runs on the identical corpus flag near-disjoint sets
#      of artifacts in the 90-96 band purely from scoring variance (an
#      artifact scoring 100 one run scores 92 the next). An exact-100
#      gate is therefore statistically unpassable and would block every
#      release on noise. 95 tolerates normal variance while still
#      catching genuine multi-point defects. The deterministic floor
#      (bin/nlpm-check) remains the exact, reproducible hard line.
#
#   2. VOCAB INTEGRITY GATE — deterministic: zero occurrences of
#      registry-declared, enforce_terms-marked deprecated terms
#      (auditor/scripts/registry-drift-check.py). The LLM
#      vocab-drift-scanner still runs, but as ADVISORY output only —
#      open-ended clustering is non-reproducible (each run judges the
#      corpus afresh and can surface different clusters), which
#      disqualifies it as a required check. Its job is to surface
#      candidates for humans to curate into registry.yaml, where they
#      become enforceable.
#
# Both gates must pass for release. Failures emit GitHub annotations and
# block the PR; the score gate also writes /tmp/scores.tsv (kept as an
# artifact) listing per-file scores so the author can see exactly which
# artifacts need fixing.
#
# Triggers:
#   - workflow_dispatch — manual run, e.g. before opening the release PR
#     to verify cleanliness without making a plugin.json commit.
#   - pull_request to main — fires on EVERY PR so the `gate` check always
#     reports a status, which lets it be a required check in branch
#     protection without blocking non-release PRs. The first job step
#     detects whether a release manifest (.claude-plugin/plugin.json or
#     .codex-plugin/plugin.json) actually changed; if not, the heavy
#     scoring steps are skipped and the job passes trivially.
#
# NOT triggered on push to main — by then the PR has merged. The gate
# belongs on the PR, before the marketplace propagation.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: nlpm-pre-release-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Detect release-bearing change
        # The gate fires on every PR to main so `gate` can be a required
        # check (a required check that never reports blocks the PR forever).
        # Only release PRs — those that change a plugin manifest — need the
        # expensive scoring. For all other PRs this step sets release=false
        # and every heavy step below is skipped, so the job passes instantly.
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch — running full gate."
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only \
               | grep -qE '^\.(claude|codex)-plugin/plugin\.json$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release manifest changed — running full pre-release gate."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release manifest change — non-release PR, gate passes trivially."
          fi

      - name: Set up Python
        if: steps.detect.outputs.release == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Deterministic floor — bin/nlpm-check
        if: steps.detect.outputs.release == 'true'
        # Catches the cheap, deterministic failures first so we don't pay
        # the LLM cost when the basics are broken. Manifest-vs-disk diff,
        # required frontmatter, hook event-name case, valid JSON/TOML.
        run: |
          if ! python3 bin/nlpm-check .; then
            echo "::error::Deterministic floor FAILED — fix manifest/disk/frontmatter issues before release."
            exit 1
          fi
          echo "::notice::Deterministic floor: clean."

      - name: Deterministic vocab gate — registry-drift-check
        if: steps.detect.outputs.release == 'true'
        # The HARD vocab gate. Byte-deterministic: greps the corpus for
        # terms the registry itself declares deprecated AND marks
        # enforce_terms, honoring sanctioned (term, path) entries. Same
        # corpus + same registry => same verdict, every run. The
        # open-ended LLM clustering below is advisory only — five gate
        # rounds on PR #708 each produced a different cluster set, which
        # is disqualifying for a required check but exactly right for
        # surfacing candidates to curate into the registry.
        run: |
          pip install --quiet pyyaml
          python3 auditor/scripts/registry-drift-check.py --self-test
          if ! python3 auditor/scripts/registry-drift-check.py --root .; then
            echo "::error::Vocab gate FAILED — enforced registry-deprecated terms found (exact file:line above)."
            exit 1
          fi
          echo "::notice::Vocab gate: clean (deterministic, registry-enforced pairs)."

      - name: Select artifacts to score
        if: steps.detect.outputs.release == 'true'
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Score ONLY the NL artifacts this PR changed. The LLM scorer is
        # non-deterministic across the whole corpus (see header), so scoring
        # unchanged pre-existing artifacts blocked releases on noise — a
        # version-bump-only PR would be judged on 40+ untouched files. The
        # deterministic floor + vocab gate above stay whole-repo. A manual
        # workflow_dispatch scores everything (deliberate full sweep).
        # The Codex layout is part of the pattern because those files ship to
        # Codex users and are byte-identical mirrors of skills/nlpm/*. Omitting
        # them made every codex/ artifact unscorable on every PR: v1.2.5 was cut
        # with the two copies of the R01 carve-out list out of sync (four
        # carve-outs on the Claude side, three on the Codex side) and no gate
        # could see it. tests/test_gate_pattern_coverage.py now fails when a
        # shipped NL artifact falls outside this pattern.
        run: |
          NL_PATTERN='^(commands/[^/]+\.md|commands/shared/[^/]+\.md|agents/[^/]+\.md|skills/nlpm/[^/]+/SKILL\.md|codex/skills/[^/]+/SKILL\.md|codex/AGENTS\.md|AGENTS\.md|CLAUDE\.md|GEMINI\.md)$'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files | grep -E "$NL_PATTERN" > /tmp/artifacts_to_score.txt || true
          else
            gh pr diff "${{ github.event.pull_request.number }}" \
                 --repo "$GITHUB_REPOSITORY" --name-only \
              | grep -E "$NL_PATTERN" > /tmp/artifacts_to_score.txt || true
          fi
          COUNT=$(wc -l < /tmp/artifacts_to_score.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "::notice::No NL artifacts changed in this PR — LLM score gate skipped (deterministic floor + vocab gate still enforced)."
          else
            echo "::notice::Scoring $COUNT changed NL artifact(s):"
            cat /tmp/artifacts_to_score.txt
          fi

      - name: LLM-judged score + vocab drift
        if: steps.detect.outputs.release == 'true' && steps.select.outputs.count != '0'
        id: llm_gate
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Defense-in-depth: pre-release gate reads + writes report files
          # only; no network exfil channels needed. Block them.
          claude_args: |
            --allowedTools Read,Glob,Grep,Bash
            --disallowedTools "Bash(curl:*)" "Bash(wget:*)" "Bash(nc:*)" "Bash(ncat:*)" "Bash(socat:*)" "Bash(telnet:*)" "Bash(ssh:*)" "Bash(scp:*)" "Bash(sftp:*)" WebFetch WebSearch
          prompt: |
            You are the pre-release quality gate for nlpm itself. Run two
            checks against nlpm's own rubric and write the results to
            specific files so the next workflow step can assert on them.

            BEFORE SCORING, READ THESE OPERATING INSTRUCTIONS:
              1. agents/scorer.md (full 5-step "Do Not Invent Findings"
                 check + known false-positive table)
              2. skills/nlpm/scoring/SKILL.md (penalty rubric v0.4.0 +
                 Known False Positive Patterns appendix). Its Penalty
                 Tables section indexes files under
                 skills/nlpm/scoring/references/ that hold the tables for
                 Codex, Antigravity, memory-file and workflow-program
                 artifacts; before scoring such an artifact, read the
                 file the index names for it and apply its rows as rubric
                 rows
              3. skills/nlpm/conventions/SKILL.md + conventions-claude/SKILL.md
                 (universal + Claude overlay — nlpm IS a Claude Code plugin,
                 Tier 2-Claude applies)
              4. skills/nlpm/patterns/SKILL.md (P10 anchored-vague-quantifier
                 exception, P11 paired CAN/CANNOT, etc.)

            === CHECK 1: SCORE GATE ===

            Score every NL artifact in nlpm. Apply Tier 2-Claude. Apply
            the 5-step Do-Not-Invent check before EVERY finding. Apply
            the Known False Positive Patterns table aggressively (nlpm
            authors the rubric and intentionally adopts patterns the
            rubric documents as not-bugs).

            Targets — score ONLY the files listed in
            /tmp/artifacts_to_score.txt. Read that file FIRST; it holds one
            repo-relative path per line — the NL artifacts this PR changed.
            Score every listed file and NO others (do not score the whole
            corpus). Notes on the kinds you may see:
              - commands/shared/*.md must have user-invocable: false
              - skills/nlpm/*/SKILL.md are Claude-side; their
                codex/skills/<name>/SKILL.md mirrors appear in the list
                too. Score a mirror's body exactly as its Claude
                original. The R06 <example> row and user-invocable are
                Claude-only, so they do not apply to a mirror.
              - AGENTS.md is the canonical universal memory file
              - GEMINI.md is a one-line @AGENTS.md import and there is no
                CLAUDE.md (Claude Code reads AGENTS.md natively) — do NOT
                flag either as missing build/test commands; content is
                in AGENTS.md

            Read EVERY listed file in full and score it against the
            rubric. Do not sample or spot-check: a score you did not
            derive from reading the file is a false pass. If you cannot
            finish a file, score it 0 — the gate then fails loudly
            instead of passing silently.

            Write per-file scores to /tmp/scores.tsv with this exact
            format (tab-separated, header row, ONE line per file, score
            as integer 0-100, then a quote):

              file\tscore\tquote
              commands/check.md\t100\t<verbatim line from the file's body>
              commands/fix.md\t95\t<verbatim line the -5 finding cites>
              ...

            The quote is copied character-for-character from the file's
            body (below the frontmatter), at least 24 characters, no
            tabs. For a file with findings, quote the line of the
            largest deduction; otherwise quote the line you checked
            last. The next step verifies every quote against the file
            and fails the release on any quote it cannot find, any
            listed file without a row, or any duplicate row.

            === CHECK 2: VOCAB INTEGRITY GATE ===

            Run the vocab-drift-scanner against the nlpm corpus.
            BEFORE: read agents/vocab-drift-scanner.md and
            skills/nlpm/vocabulary/SKILL.md for the protocol.

            Use the "Write JSONL findings to {path}" alternate output
            mode documented in vocab-drift-scanner.md. Write drift
            clusters (if any) as JSONL to /tmp/drift.jsonl — one record
            per cluster. If zero clusters, the file should be empty (or
            absent — either is treated as zero by the assertion).

            === DISCIPLINE ===
            - Do NOT modify any files.
            - Do NOT use WebFetch / curl / wget — local files only.
            - The two output files (/tmp/scores.tsv, /tmp/drift.jsonl)
              are the ONLY artifacts the next step reads. Make them
              parseable. Verbose explanation in conversation is fine
              but cannot substitute for correct file output.
            - Report briefly when done: artifact count scored, drift
              cluster count.

      - name: Assert gates
        if: steps.detect.outputs.release == 'true'
        # Checks the scores the LLM step wrote (complete, >= MIN_SCORE, each
        # grounded in a verified quote) and reports drift clusters as advisory
        # notices. Annotations land in
        # the PR's Files tab so the author sees them in context.
        run: |
          set -u
          FAILED=0
          # Minimum per-artifact LLM score. See the header comment for why
          # this is 95, not 100 (LLM scorer variance). The deterministic
          # floor (bin/nlpm-check) is the exact hard line; this is the
          # variance-tolerant judged-quality threshold.
          MIN_SCORE=95

          # --- Score gate ---
          # check-gate-scores.py fails closed: every listed file scored once,
          # integer scores >= MIN_SCORE, and each row's quote found verbatim
          # in that file's body, so a row cannot be written without a read.
          if [ "${{ steps.select.outputs.count }}" = "0" ]; then
            echo "::notice::Score gate: this PR changed no NL artifacts — nothing to score. (bin/nlpm-check + the deterministic vocab gate above still ran on the whole repo.)"
          elif ! python3 auditor/scripts/check-gate-scores.py --list /tmp/artifacts_to_score.txt --scores /tmp/scores.tsv --min "$MIN_SCORE"; then
            FAILED=1
          fi

          # --- Vocab drift (ADVISORY) ---
          # The hard vocab gate already ran deterministically in its own
          # step. The LLM clustering below never fails the build: it
          # surfaces candidates to curate into registry.yaml.
          if [ -s /tmp/drift.jsonl ]; then
            CLUSTERS=$(wc -l < /tmp/drift.jsonl | tr -d ' ')
            echo "::notice::Vocab drift advisory — $CLUSTERS candidate cluster(s) for registry curation (see artifact):"
            cat /tmp/drift.jsonl | head -20
          else
            echo "::notice::Vocab drift advisory — zero candidate clusters."
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Pre-release gate did NOT pass. Fix the findings above before merging this release PR."
            exit 1
          fi
          echo "::notice::Pre-release gate PASSED. Release PR is good to merge."

      - name: Upload gate output as workflow artifact
        # Keep the per-file scores around for 30 days so historical
        # release-prep runs can be inspected.
        if: always() && steps.detect.outputs.release == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: pre-release-gate-${{ github.event.pull_request.number || github.run_id }}
          path: |
            /tmp/scores.tsv
            /tmp/drift.jsonl
          retention-days: 30
          if-no-files-found: warn
